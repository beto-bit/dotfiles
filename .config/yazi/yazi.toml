[opener]
edit = [
    { run = '$EDITOR "%s1"', block = true },
    { run = 'nvim "%s1"', block = true, desc = 'Neovim' },
]

# PDF view
[[open.prepend_rules]]
mime = 'application/pdf'
use = [ 'open', 'zathura' ]

[[opener.zathura]]
run = 'zathura %s1'
for = 'linux'
desc = 'Zathura'

# Wallpaper previewer
[[open.prepend_rules]]
mime = 'image/*'
use = [ 'open', 'set-wallpaper' ]

[[opener.set-wallpaper]]
run = 'hyprctl hyprpaper wallpaper ,%s1'
for = 'linux'
desc = 'Set as wallpaper'
